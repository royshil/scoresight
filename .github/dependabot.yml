# Weekly dependency update pull requests.
# The Windows tesserocr wheel (a direct URL in requirements-win.txt) isn't
# tracked: update it by hand from simonflueckiger/tesserocr-windows_build.
# Bumping ruff in requirements-dev.txt also needs the same version in
# .pre-commit-config.yaml (tests/test_packaging.py checks that they match).
version: 2
updates:
  - package-ecosystem: pip
    # requirements*.txt in the repository root
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      # requirements-eval.txt's pywinrt projections require each other at the
      # same version: they can only move together
      pywinrt:
        patterns: ["winrt-*"]
      # pyobjc-framework-* require pyobjc-core at the same version (13.0's
      # AVFoundation needs core >= 13.0): they can only move together
      pyobjc:
        patterns: ["pyobjc-*"]
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Qt upgrades need the src/ui_*.py files regenerated and manual testing
      - dependency-name: PySide6-Essentials
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      - dependency-name: opencv-python-headless
        update-types: ["version-update:semver-major"]
      - dependency-name: opencv-python
        update-types: ["version-update:semver-major"]
      # requirements-eval.txt: OnnxTR 0.9.0 requires huggingface-hub < 2;
      # lift this once an OnnxTR release allows 2.x
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
      # pyobjc 13.0's x86_64 _CoreMedia (AVFoundation imports it) links
      # @rpath/libswiftCoreMedia.dylib with no rpath, so the Intel Mac app
      # fails to list cameras (its self-test failed on macos-x64, #188).
      # Only 13.0: a later release gets a PR and the macOS builds test it
      - dependency-name: "pyobjc-*"
        versions: ["13.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]
