# pre-commit hooks: install once per clone with `pre-commit install`
# (pre-commit is in requirements-dev.txt); `pre-commit run --all-files` checks
# everything. The ruff version must match requirements-dev.txt
# (tests/test_packaging.py checks it).
exclude: ^src/ui_.*\.py$  # generated by scripts/compile_ui.py

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      # Python only, like `ruff check .` / `ruff format --check .` in CI
      # (the hooks would otherwise also format code blocks in Markdown)
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # not the Qt Designer/translation sources or the OBS/vMix data files
      - id: end-of-file-fixer
        exclude: \.(ts|ui|qm|traineddata|ico|png|svg)$|^obs_data/|^scoresight\.vmix$
      - id: trailing-whitespace
        exclude: \.(ts|ui|qm|traineddata)$|^obs_data/|^scoresight\.vmix$
      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: ^tesseract/tessdata/
